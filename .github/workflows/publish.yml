name: Publish to Pub.dev

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*' # Kích hoạt tự động khi push tag như v1.3.0, v1.3.1...

# Quyền hạn cấp cho GitHub Actions để xác thực OIDC an toàn với pub.dev
permissions:
  id-token: write

jobs:
  publish:
    name: Build Extension, Test & Publish
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 💙 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: 📦 Install Root Dependencies
        run: flutter pub get

      - name: 🧪 Run Static Analysis & Tests
        run: |
          dart analyze
          flutter test --coverage

      - name: 🛠️ Build DevTools Web Extension Bundle
        run: |
          chmod +x tool/build_extension.sh
          ./tool/build_extension.sh

      - name: 🚀 Publish Package to Pub.dev (via OIDC)
        run: dart pub publish --force
